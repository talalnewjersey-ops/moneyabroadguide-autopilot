name: MAG SEO Autopilot

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'

jobs:
  seo_audit:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 🐍 Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 📦 Install dependencies
      - name: Install dependencies
        run: pip install requests

      # 🚀 Run schema + money block optimizer (all posts)
      - name: Run SEO + money block optimizer
        run: python seo_safe_optimizer.py
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}

      # 📗 Run landing page conversion optimizer (ebook page only)
      - name: Run landing page optimizer
        run: python landing_page_optimizer.py
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
